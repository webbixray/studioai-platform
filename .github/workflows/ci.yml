name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: [3.10]

    steps:

    - name: Install clippy and cargo
      run: |
        rustup component add clippy
    - name: Install Go vet
      run: |
        curl -sSL https://dl.google.com/go/go1.20.5.linux-amd64.tar.gz | tar -xz -C /usr/local
        export PATH=/usr/local/go/bin:$PATH
    - name: Install SpotBugs and Java
      run: |
        sudo apt-get update
        sudo apt-get install -y openjdk-11-jdk spotbugs
    - name: Install ESLint
      run: |
        cd packages/frontend
        npm install eslint
    - name: Run Go vet
      run: |
        cd packages && go vet ./... || exit 1
    - name: Run Rust clippy
      run: |
        cd packages && cargo clippy -- -D warnings || exit 1
    - uses: actions/checkout@v3
    - name: Set up Node
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install backend deps
      run: |
        python -m pip install --upgrade pip
        pip install -r packages/backend/requirements.txt
    - name: Run backend tests
      run: pytest packages/backend/tests
    - name: Lint backend
      run: flake8 packages/backend
    - name: Install frontend deps
      run: |
        cd packages/frontend
        npm ci
    - name: Build frontend
      run: |
        cd packages/frontend
        npm run build
